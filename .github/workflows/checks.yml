name: checks
# Called by the workflows that need the checks, so a pull request and main run the same ones.
on:
  workflow_call:
jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm type:check
      - run: pnpm knip
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
  e2e:
    name: end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Only what the app reaches: the database, Auth, PostgREST, Storage and the gateway.
      - run:
          pnpm exec supabase start --exclude
          realtime,studio,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta
        working-directory: apps/backend
        env:
          # config.toml names it for the hosted project; nothing here signs in with Google.
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: unused
      - run: pnpm --filter @prezentorion/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: apps/e2e/test-results
          retention-days: 7
